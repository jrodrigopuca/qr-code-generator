name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run typecheck

      - name: Run Biome (lint + format + imports)
        run: pnpm run check

      - name: Run tests with coverage
        run: pnpm run test:coverage

      # Only core defines test:coverage, so this covers every package.
      # Serial because parallel Vitest runs share node_modules/.vitest-cache.
      - name: Run tests for all packages
        run: pnpm exec turbo run test --concurrency=1

      - name: Build
        run: pnpm run build

      - name: Run E2E tests
        run: pnpm run e2e

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./packages/core/coverage/coverage-final.json
          fail_ci_if_error: false
